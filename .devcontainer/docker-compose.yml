version: "3.9"

services:
  app:
    image: node:22
    working_dir: /workspace
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_pass
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: