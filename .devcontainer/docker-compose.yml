services:
  app:
    image: node:22
    working_dir: /workspace/lms-backend
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/lms_db
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: lms_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/lms_db | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodata: